<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GLOBAL RH — Nouveau site en préparation</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f172a;
    color: #f8fafc;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .wrap { max-width: 560px; }
  h1 {
    font-size: 2rem;
    font-weight: 700;
    margin-bottom: 12px;
    letter-spacing: -0.02em;
  }
  p {
    font-size: 1.05rem;
    color: #cbd5e1;
    line-height: 1.6;
    margin-bottom: 28px;
  }
  .badge {
    display: inline-block;
    background: #1e293b;
    border: 1px solid #334155;
    color: #94a3b8;
    font-size: 0.85rem;
    padding: 6px 16px;
    border-radius: 999px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>GLOBAL RH</h1>
    <p>Le nouveau site est actuellement en préparation.<br>Merci de votre patience, il arrive bientôt.</p>
    <span class="badge">Site en construction</span>
  </div>
</body>
</html>
